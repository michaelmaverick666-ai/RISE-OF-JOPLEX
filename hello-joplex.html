<!DOCTYPE html>
<html>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 50px;
    }

    h1 {
        font-size: 40px;
    }

    p {
        font-size: 20px;
    }
</style>
<head>
    <title>Rise of Joplex</title>
</head>
<body>

    <h1>Welcome to Joplex 🚀</h1>
    <p>I am building Joplex one mission at a time.</p>
<p>Mission 004: I am learning how to build for the web.</p>
<button onclick="showMessage()">Activate Joplex</button>
<br><br>

<input type="text" id="nameInput" placeholder="Enter your name">
<br><br>

<input type="text" id="commandInput" placeholder="Enter a command">

<button onclick="runCommand()">Run Command</button>

<p id="commandResponse"></p>
<button onclick="greetUser()">Greet Joplex</button>
<p id="response"></p>
<p id="status">Joplex is offline 🔴</p>
<p id="clock">Time loading...</p>
<button onclick="activateJoplex()">Activate System</button>
<br><br>

<button onclick="resetJoplex()">Reset Joplex Memory</button>
<script>
    function showMessage() {
        alert("Joplex activated! 🚀");
    }
function greetUser() {
    let name = document.getElementById("nameInput").value;
    let response = document.getElementById("response");

    if (name === "") {
        response.textContent = "Please enter your name.";
    } else {
        localStorage.setItem("joplexName", name);
        response.textContent = "Welcome to Joplex, " + name + "! 🚀";
    }
}
let savedName = localStorage.getItem("joplexName");

if (savedName) {
    document.getElementById("response").textContent =
        "Welcome back, " + savedName + "! 🤖";
}
function activateJoplex() {
    let status = document.getElementById("status");

    status.textContent = "Joplex is online 🟢";
}function resetJoplex() {
    localStorage.removeItem("joplexName");

    document.getElementById("nameInput").value = "";
    document.getElementById("response").textContent =
        "Joplex memory has been reset. 🧠";
}function updateClock() {
    let now = new Date();
    let time = now.toLocaleTimeString();

    document.getElementById("clock").textContent =
        "Current time: " + time;
}

updateClock();
setInterval(updateClock, 1000);function runCommand() {
    let command = document.getElementById("commandInput").value.toLowerCase();
    let response = document.getElementById("commandResponse");

    if (command === "status") {
        response.textContent = "Joplex systems are online 🟢";

    } else if (command === "time") {
        response.textContent = "The current time is " + new Date().toLocaleTimeString() + " ⏰";

    } else if (command === "hello") {
        response.textContent = "Hello! Joplex is ready to assist you. 🤖";

    } else {
        response.textContent = "Command not recognized.";
    }
}</script>
</body>
</html>
