<!DOCTYPE html>
<html>
<head>
    <title>Rise of Joplex</title>
<meta name="color-scheme" content="light dark">
<style>
    body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 50px;
    background: #0f1219;
    color: white;
    min-height: 100vh;
    margin: 0;
}

    h1 {
        font-size: 40px;
    }

    p {
        font-size: 20px;
    }

    /* LIGHT MODE */
    html.light {
        background: white !important;
        color: black !important;
    }

    html.light h1,
    html.light h2,
    html.light h3,
    html.light p,
    html.light li,
    html.light #status,
    html.light #clock,
    html.light #response,
    html.light #commandResponse {
        color: black !important;
    }

  html.light input,
html.light button {
    background: #f2f2f2 !important;
    color: black !important;
    border: 1px solid #999 !important;
}

html.light body {
    background: white !important;
    color: black !important;
}
html {
    color-scheme: dark;
}

html.light {
    color-scheme: light;
}
</style>
</head>
<body>
<button id="themeToggle" onclick="toggleTheme()">🌙 Dark Mode</button>

    <h1>Welcome to Joplex 🚀</h1>
    <p>I am building Joplex one mission at a time.</p>
<p>Mission 004: I am learning how to build for the web.</p>
<button onclick="showMessage()">Activate Joplex</button>
<br><br>

<input type="text" id="nameInput" placeholder="Enter your name">
<br><br>

<input type="text" id="commandInput" placeholder="Enter a command">

<button onclick="runCommand()">Run Command</button>
<button onclick="startListening()">🎙️ Speak</button>
<p id="commandResponse"></p>
<h3>Command History</h3>
<ul id="commandHistory"></ul>
<button onclick="clearHistory()">Clear History</button>
<button onclick="greetUser()">Greet Joplex</button>
<p id="response"></p>
<p id="status">Joplex is offline 🔴</p>
<p id="clock">Time loading...</p>
<button onclick="activateJoplex()">Activate System</button>
<br><br>

<button onclick="resetJoplex()">Reset Joplex Memory</button>
<script>
    function showMessage() {
        alert("Joplex activated! 🚀");
    }
function greetUser() {
    let name = document.getElementById("nameInput").value;
    let response = document.getElementById("response");

    if (name === "") {
        response.textContent = "Please enter your name.";
    } else {
        localStorage.setItem("joplexName", name);
        response.textContent = "Welcome to Joplex, " + name + "! 🚀";
    }
}
let savedName = localStorage.getItem("joplexName");

if (savedName) {
    document.getElementById("response").textContent =
        "Welcome back, " + savedName + "! 🤖";
}
function activateJoplex() {
    let status = document.getElementById("status");

    status.textContent = "Joplex is online 🟢";
}function resetJoplex() {
    localStorage.removeItem("joplexName");

    document.getElementById("nameInput").value = "";
    document.getElementById("response").textContent =
        "Joplex memory has been reset. 🧠";
}function updateClock() {
    let now = new Date();
    let time = now.toLocaleTimeString();

    document.getElementById("clock").textContent =
        "Current time: " + time;
}

updateClock();
setInterval(updateClock, 1000);
function speak(text) {
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-US";
    speech.rate = 1;
    speech.pitch = 1;

    window.speechSynthesis.speak(speech);
}
function runCommand() {
    let command = document.getElementById("commandInput").value.toLowerCase().trim();
    let response = document.getElementById("commandResponse");
    let history = document.getElementById("commandHistory");

    if (command.includes("motivate")) {
        let messages = [
            "Keep going. Small progress is still progress. 💪",
            "Build today what your future self will thank you for. 🚀",
            "One mission at a time. Joplex is growing. 🤖",
            "You don't need to know everything. You just need to keep learning. 🧠"
        ];

        let randomIndex = Math.floor(Math.random() * messages.length);
        response.textContent = messages[randomIndex];

    } else if (command.includes("hello")) {
        response.textContent = "Hello! Joplex is ready to assist you. 🤖";

    } else if (command.includes("time")) {
        response.textContent =
            "The current time is " + new Date().toLocaleTimeString() + " ⏰";

    } else if (command.includes("status") || command.includes("online")) {
        response.textContent = "Joplex systems are online 🟢";

    } else if (command.includes("remember")) {
        let memory = prompt("What should Joplex remember?");

        if (memory) {
            localStorage.setItem("joplexMemory", memory);
            response.textContent = "Memory saved. 🧠";
        } else {
            response.textContent = "Nothing was saved.";
        }

    } else if (command.includes("show memory")) {
        let memory = localStorage.getItem("joplexMemory");

        if (memory) {
            response.textContent = "Joplex remembers: " + memory + " 🧠";
        } else {
            response.textContent = "Joplex has no saved memory yet.";
        }
} else if (command.includes("who are you")) {
    response.textContent = "I am Joplex, your AI project. 🤖🚀";
} else if (command.includes("what is my name")) {
    let name = localStorage.getItem("joplexName");

    if (name) {
        response.textContent = "Your name is " + name + ". 👤🤖";
    } else {
        response.textContent = "I don't know your name yet.";
    }
} else if (command.includes("what is my goal")) {
    response.textContent = "Your goal is to build Joplex. 🚀";
} else if (command.includes("what is my mission")) {
    response.textContent = "Your current mission is Mission 004 — Learning Web Development. 🚀";
speak(response.textContent);
} else if (command.includes("what do i like")) {
    response.textContent = "You like building Joplex and learning new things. 🚀🧠";
} else if (command.includes("introduce me")) {
    let name = localStorage.getItem("joplexName");

    if (name) {
        response.textContent = "This is " + name + ". He is building Joplex one mission at a time. 🚀";
    } else {
        response.textContent = "I don't know your name yet.";
    }
} else if (command.includes("good morning")) {
    response.textContent = "Good morning! Let's make today another step forward for Joplex. ☀️🚀";
} else if (command.includes("i am back")) {
    let name = localStorage.getItem("joplexName");

    if (name) {
        let greetings = [
            "Welcome back, " + name + "! 🤖🚀",
            "Good to see you again, " + name + "! 🧠🔥",
            "Joplex is ready for you, " + name + "! ⚡🤖"
        ];

        let randomIndex = Math.floor(Math.random() * greetings.length);
        response.textContent = greetings[randomIndex];

    } else {
        response.textContent = "Welcome back! I don't know your name yet.";
    }
} else if (command.includes("thank you")) {
    let replies = [
        "You're welcome! 🤖❤️",
        "Always happy to help. 🚀",
        "Anytime! Let's keep building Joplex. 🔥"
    ];

    let randomIndex = Math.floor(Math.random() * replies.length);
    response.textContent = replies[randomIndex];
} else if (command.includes("goodbye")) {
    let replies = [
        "Goodbye! Keep building. 🚀",
        "See you next time! Joplex will be here. 🤖",
        "Until the next mission! 🔥"
    ];

    let randomIndex = Math.floor(Math.random() * replies.length);
    response.textContent = replies[randomIndex];
} else if (command.startsWith("calculate")) {
    let calculation = command.replace("calculate", "").trim();

    try {
        let answer = Function('"use strict"; return (' + calculation + ')')();
        response.textContent = "The answer is " + answer + ". 🧮🤖";
    } catch (error) {
        response.textContent = "I couldn't calculate that. 🤔";
    }
} else if (command.startsWith("remember ")) {
    let memory = command.replace("remember ", "").trim();
    localStorage.setItem("joplexMemory", memory);
    response.textContent = "🧠 I'll remember: " + memory;

} else if (command === "show memory") {
    let memory = localStorage.getItem("joplexMemory");
    response.textContent = memory
        ? "🧠 Memory: " + memory
        : "🧠 I don't remember anything yet.";

} else if (command === "forget memory") {
    localStorage.removeItem("joplexMemory");
    response.textContent = "🗑️ Memory cleared.";
    }

 else {
        response.textContent = "I don't understand that command yet.";
    }

    let item = document.createElement("li");
    item.textContent = command;
    history.appendChild(item);
}
function toggleTheme() {
    const html = document.documentElement;
    html.classList.toggle("light");

    const button = document.getElementById("themeToggle");

    if (html.classList.contains("light")) {
        button.textContent = "🌙 Dark Mode";
        localStorage.setItem("joplexTheme", "light");
    } else {
        button.textContent = "☀️ Light Mode";
        localStorage.setItem("joplexTheme", "dark");
    }
}

// Load saved theme
const savedTheme = localStorage.getItem("joplexTheme");
if (savedTheme === "light") {
    document.documentElement.classList.add("light");
    document.getElementById("themeToggle").textContent = "🌙 Dark Mode";
}
function startListening() {
    const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Speech recognition is not supported in this browser.");
        return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.interimResults = false;

    recognition.onresult = function (event) {
        const spoken = event.results[0][0].transcript.toLowerCase();

        document.getElementById("commandInput").value = spoken;
        runCommand();
    };

    recognition.start();
}
function speak(text) {
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-US";
    speech.rate = 1;
    speech.pitch = 1;

    window.speechSynthesis.speak(speech);
}
function clearHistory() {
    document.getElementById("commandHistory").innerHTML = "";
}</script>
</body>
</html>
