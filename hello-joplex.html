<!DOCTYPE html>
<html>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 50px;
    }

    h1 {
        font-size: 40px;
    }

    p {
        font-size: 20px;
    }
</style>
<head>
    <title>Rise of Joplex</title>
</head>
<body>

    <h1>Welcome to Joplex 🚀</h1>
    <p>I am building Joplex one mission at a time.</p>
<p>Mission 004: I am learning how to build for the web.</p>
<button onclick="showMessage()">Activate Joplex</button>
<br><br>

<input type="text" id="nameInput" placeholder="Enter your name">

<button onclick="greetUser()">Greet Joplex</button>
<script>
    function showMessage() {
        alert("Joplex activated! 🚀");
    }
function greetUser() {
    let name = document.getElementById("nameInput").value;

    if (name === "") {
        alert("Please enter your name.");
    } else {
        alert("Welcome to Joplex, " + name + "! 🚀");
    }
}
</script>
</body>
</html>
